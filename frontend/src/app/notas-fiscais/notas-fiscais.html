<mat-card>
  <mat-card-title>Notas Fiscais</mat-card-title>
  <mat-card-content>
    <form (ngSubmit)="criarNota()" class="form-nota">
      <mat-form-field appearance="outline">
        <mat-label>Número</mat-label>
        <input matInput type="number" [(ngModel)]="novoNumero" name="numero" required>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit">Criar Nota</button>
    </form>
  </mat-card-content>
</mat-card>

<div *ngIf="mensagemErro" class="erro">
  {{ mensagemErro }}
</div>

<mat-card *ngFor="let nota of notas" class="nota-card">
  <mat-card-title>
    Nota #{{ nota.numero }}
    <mat-chip [color]="nota.status === 'Aberta' ? 'accent' : 'primary'" selected>
      {{ nota.status }}
    </mat-chip>
  </mat-card-title>

  <mat-card-content>
    <table mat-table [dataSource]="nota.itens" class="mat-elevation-z1">
      <ng-container matColumnDef="produtoId">
        <th mat-header-cell *matHeaderCellDef>Produto ID</th>
        <td mat-cell *matCellDef="let item">{{ item.produtoId }}</td>
      </ng-container>

      <ng-container matColumnDef="quantidade">
        <th mat-header-cell *matHeaderCellDef>Quantidade</th>
        <td mat-cell *matCellDef="let item">{{ item.quantidade }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunasExibidas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunasExibidas;"></tr>
    </table>

    <div *ngIf="nota.status === 'Aberta'" class="acoes-nota">
      <mat-form-field appearance="outline">
        <mat-label>Produto ID</mat-label>
        <input matInput type="number" [(ngModel)]="getNovoItem(nota.id!).produtoId" name="produtoId-{{ nota.id }}">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Quantidade</mat-label>
        <input matInput type="number" [(ngModel)]="getNovoItem(nota.id!).quantidade" name="quantidade-{{ nota.id }}">
      </mat-form-field>

      <button mat-stroked-button color="primary" (click)="adicionarItem(nota.id!)">Adicionar Item</button>
      <button mat-raised-button color="accent" (click)="fecharNota(nota.id!)">Fechar Nota</button>
    </div>
  </mat-card-content>
</mat-card>
